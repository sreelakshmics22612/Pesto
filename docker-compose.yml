services:
  web:
    build: .
    container_name: pesto_web
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: pesto_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fol_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/fol_db.sql:/docker-entrypoint-initdb.d/fol_db.sql

volumes:
  mysql_data: